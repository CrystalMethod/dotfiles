# Minimum mise version compatible with this dotfiles configuration.
# Raise this only when a configuration or tool change requires newer mise behavior.
# Declarative system bootstrap and automatic dangling npm install repair require mise 2026.8.15 or newer.
min_version = "2026.8.15"

[tools]

# CLI tools
bat = "0.26.1"
bun = "1.4.2"
eza = "0.23.5"
fd = "10.5.0"
fnox = "1.35.3"
lazygit = "0.65.1"
maven = "3.9.16"
neovim = "0.12.5"
television = "0.15.9"

# Aqua tools
"aqua:anomalyco/opencode" = "1.18.32"
"aqua:bats-core/bats-core" = "1.14.0"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:cli/cli" = "2.101.0"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:j178/prek" = "0.5.3"
"aqua:joshmedeski/sesh" = { version = "2.31.0", os = ["macos", "linux"] }
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.1"
"github:raine/workmux" = "0.1.266"
"aqua:rtk-ai/rtk" = "0.50.0"
"aqua:tmux/tmux-builds" = "3.7c"
"aqua:twpayne/chezmoi" = "2.72.2"
"aqua:x-motemen/ghq" = "1.10.1"

# Language runtimes
java = "temurin-25"
node = "lts"

# npm tools
"npm:textlint" = "15.8.0"
