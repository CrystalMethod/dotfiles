# Minimum mise version compatible with this dotfiles configuration.
# Raise this only when a configuration or tool change requires newer mise behavior.
# Declarative system bootstrap and automatic dangling npm install repair require mise 2026.8.15 or newer.
min_version = "2026.8.15"

[tools]

# CLI tools
bat = "0.26.1"
bun = "1.4.3"
eza = "0.23.5"
fd = "10.5.0"
fnox = "1.41.0"
lazygit = "0.66.2"
maven = "3.9.16"
neovim = "0.12.6"
television = "0.15.9"

# Aqua tools
"aqua:anomalyco/opencode" = "1.19.3"
"aqua:astral-sh/uv" = "0.13.4"
"aqua:biomejs/biome" = "2.5.14"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:charmbracelet/glow" = "3.0.0"
"aqua:charmbracelet/gum" = "2.0.2"
"aqua:cli/cli" = "2.102.0"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:joshmedeski/sesh" = { version = "2.33.0", os = ["macos", "linux"] }
"github:raine/workmux" = "0.1.276"
"aqua:rtk-ai/rtk" = "1.0.1"
"aqua:tmux/tmux-builds" = "3.7c"
"aqua:twpayne/chezmoi" = "2.73.3"
"aqua:x-motemen/ghq" = "1.11.2"

"forgejo:gitea/tea" = { version = "v0.15.1", api_url = "https://gitea.com/api/v1" }

# Language runtimes
java = "temurin-25"
node = "lts"

[tools."http:jdtls"]
version = "1.58.0"
url = "https://download.eclipse.org/jdtls/milestones/1.58.0/jdt-language-server-1.58.0-202604151538.tar.gz"
sha256 = "2a5bbe55ec91b4325392050dc422cead3220a2459b3766be35e1fff45b4a50d9"
