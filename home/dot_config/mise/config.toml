# Minimum mise version compatible with this dotfiles configuration.
# Raise this only when a configuration or tool change requires newer mise behavior.
# Declarative system bootstrap and automatic dangling npm install repair require mise 2026.8.15 or newer.
min_version = "2026.8.15"

[tools]

# CLI tools
age = "1.3.2"
bat = "0.26.1"
biome = "2.5.14"
bun = "1.4.4"
chezmoi = "2.73.3"
eza = "0.23.5"
fd = "10.5.0"
fnox = "1.45.0"
gh = "2.103.3"
ghq = "1.11.2"
glow = "3.0.0"
gum = "2.0.2"
lazygit = "0.66.2"
maven = "3.9.16"
neovim = "0.12.6"
opencode = "2.2.5"
ripgrep = "15.2.0"
rtk = "1.1.0"
television = "0.15.9"
uv = "0.13.6"
workmux = "0.1.277"

# Aqua tools
"aqua:joshmedeski/sesh" = { version = "2.34.0", os = ["macos", "linux"] }

"forgejo:gitea/tea" = { version = "v0.15.1", api_url = "https://gitea.com/api/v1" }

# Language runtimes
java = "temurin-25"
node = "lts"

[tools."http:jdtls"]
version = "1.58.0"
url = "https://download.eclipse.org/jdtls/milestones/1.58.0/jdt-language-server-1.58.0-202604151538.tar.gz"
sha256 = "2a5bbe55ec91b4325392050dc422cead3220a2459b3766be35e1fff45b4a50d9"
