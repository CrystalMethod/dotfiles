name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        include:
          - os: macos-latest
            target_os: macos
          - os: ubuntu-latest
            target_os: ubuntu
    env:
      TARGET_OS: ${{ matrix.target_os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          if [ "$TARGET_OS" = "macos" ]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: Install shfmt
        run: |
          if [ "$TARGET_OS" = "macos" ]; then
            brew install shfmt
          else
            sudo apt-get update && sudo apt-get install -y shfmt
          fi

      - name: Install bats
        run: |
          if [ "$TARGET_OS" = "macos" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats
          fi

      - name: Lint
        run: make lint

      - name: Format
        run: make format

      - name: Test
        run: make test
