name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        include:
          - os: macos-latest
            target_os: macos
          - os: ubuntu-latest
            target_os: ubuntu
    env:
      MISE_ENV: ci
      TARGET_OS: ${{ matrix.target_os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Lint
        run: make lint

      - name: Format
        run: make format

      - name: Test
        run: make test
